# A test build of the Andromon installers, started by hand from the Actions tab (Run workflow).
#
# Releases are not made here. Deshan555/Andromon_Releases checks this repository's "release" branch
# every hour and, when package.json there has a new version, builds every installer, the phone app and
# the web version and publishes them (see .github/workflows/build.yml in that repository). To release:
# raise "version" in package.json and push to the release branch.
#
# This workflow builds the same files from the branch you pick and attaches them to the run, to try a
# change on every system before it is released:
#   macOS    .dmg                Apple Silicon + Intel (ad-hoc signed unless CSC_LINK is set)
#   Windows  setup .exe          x64, ARM64, both in one, and 32-bit (ia32, on Electron 43)
#   Linux    .AppImage and .deb  x64 + ARM64
#   Web      .zip
name: Test build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Electron 45 has no 32-bit Windows build; 43 is the newest that has one. Only the ia32 setup uses it.
  ELECTRON_IA32: "43.8.12"

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - name: Stamp the build number
        run: |
          node -e 'require("fs").writeFileSync("build-info.json", JSON.stringify({ build: 0, commit: process.env.GITHUB_SHA || "", date: new Date().toISOString() }) + "\n")'
          cat build-info.json
      - run: npm run build:renderer
      - name: Build
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signing=()
          if [ -z "$CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD
            [ "$RUNNER_OS" = macOS ] && signing=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          fi
          case "$RUNNER_OS" in
            macOS)   npx electron-builder --mac "${signing[@]}" --publish never ;;
            Windows) npx electron-builder --win --publish never
                     npx electron-builder --win nsis:ia32 "-c.electronVersion=$ELECTRON_IA32" --publish never ;;
            Linux)   npx electron-builder --linux AppImage:x64 AppImage:arm64 deb:x64 deb:arm64 --publish never ;;
          esac
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: andromon-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  web:
    name: Build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with: { name: andromon-web, path: dist/andromon-web.zip, if-no-files-found: error }
