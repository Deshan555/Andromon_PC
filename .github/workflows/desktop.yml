# Builds the Droid Desk installers on every push to the "release" branch:
#   macOS    .dmg       (Apple Silicon + Intel)
#   Windows  .exe       (setup wizard, x64 + ARM64)
#   Linux    .AppImage and .deb (x64)
# The installers are attached to the workflow run, and collected in a draft GitHub Release named
# after the version in package.json (v0.1.0), which you review and publish yourself.
# The build then commits two files to the release branch: latest.json (the newest build and its
# installers) and CHANGELOG.md (what changed in each build).
# It also runs from the "Actions" tab (Run workflow) and for a tag like v0.1.0; those runs only
# attach the installers to the run.
name: Build desktop app

on:
  workflow_dispatch:
  push:
    branches: [release]
    tags: ["v*"]

# A newer push to the same branch replaces a build that is still running.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: dist:mac
          - name: Windows
            os: windows-latest
            script: dist:win
          - name: Linux
            os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Unsigned build. To sign, add secrets and env vars:
      #   macOS:   CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
      #   Windows: CSC_LINK, CSC_KEY_PASSWORD (or an Azure Trusted Signing config)
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: droid-desk-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  # Push to "release" only: put all installers in one draft release for this version, and record the
  # build on the release branch itself in latest.json and CHANGELOG.md (scripts/release-manifest.js).
  release:
    name: Draft release, manifest and changelog
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0 # the changelog is made from the commits since the previous build
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Write latest.json and CHANGELOG.md
        run: node scripts/release-manifest.js installers "$RUNNER_TEMP/release-notes.md"
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          ls -la installers
          if gh release view "$version" >/dev/null 2>&1; then
            # Same version pushed again: replace the files on the existing release.
            # Its description becomes the changes since the previous build.
            gh release upload "$version" installers/* --clobber
            gh release edit "$version" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$version" installers/* --draft --target "$GITHUB_SHA" \
              --title "Droid Desk $version" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
      # A push made with the workflow's own token does not start another build.
      - name: Commit latest.json and CHANGELOG.md to the release branch
        run: |
          version="v$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json CHANGELOG.md
          git commit -m "Record build ${GITHUB_RUN_NUMBER} of ${version}"
          git push origin HEAD:release
